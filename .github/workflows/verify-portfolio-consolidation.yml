name: Verify one portfolio cleanup

on:
  pull_request:
    paths:
      - "app/github/**"
      - "README.md"
      - ".github/workflows/verify-portfolio-consolidation.yml"

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate dashboard retirement
        run: |
          grep -Fq 'permanentRedirect("/")' app/github/page.tsx
          test ! -e app/github/github.module.css
          grep -Fq 'https://github.com/Asbabillail' README.md
      - name: Build production bundle
        run: npm run build
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
