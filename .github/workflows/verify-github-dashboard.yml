name: Verify A4.s03 GitHub dashboard

on:
  pull_request:
    paths:
      - "app/github/**"
      - "tsconfig.github.json"
      - ".github/workflows/verify-github-dashboard.yml"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint new dashboard
        run: npx eslint app/github/page.tsx
      - name: Type check new dashboard
        run: npx tsc --noEmit --project tsconfig.github.json
      - name: Build Next.js production bundle
        run: npm run build
